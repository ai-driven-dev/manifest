# deploy.yml — Build, push to GHCR, deploy on AIDD server
#
# Trigger: push to main + manual dispatch
# Pattern: registry-based deploy (build once, deploy anywhere) — Leszko rule
# Runner: self-hosted on AIDD server (zero billing, zero SSH, the runner IS the
#         server, so deploy = local docker compose pull + up)
# Source: aidd-driven-dev/website pattern (validated 4 NLM notebooks: GHA,
#         Docker, Jenkins, DevOps-IA), KB Docker §06 (CI/CD integration).
#
# Build context is `app/` (this repo nests the Astro project under app/).

name: Deploy to AIDD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default: read-only (Principle of Least Privilege — NLM GHA)
permissions: read-all

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_DIR: /opt/infrastructure/services/aidd-manifest
  CONTAINER_NAME: aidd-manifest
  CONTAINER_PORT: "4321"
  PUBLIC_ORIGIN: https://www.ai-driven-development.org
  INDEXNOW_KEY: a1f401c8d1e64cb99fbe0d7f4a462026

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Build & Push to GitHub Container Registry
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history so the signature-date generator can read each
          # signatory file's add commit (git log --diff-filter=A).
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Set up Node.js
        # The self-hosted runner has no node on PATH; setup-node provides it for
        # the generator step below.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 'lts/*'

      - name: Generate signature dates from git
        # Derives signatures' dates from git history into
        # app/src/content/signature-dates.json so it lands in the build context
        # (.git is excluded from the Docker image, so this can't run inside it).
        run: node app/scripts/gen-signature-dates.mjs

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache-manifest
          cache-to: type=local,dest=/tmp/.buildx-cache-manifest-new,mode=max

      - name: Rotate buildx cache
        run: |
          rm -rf /tmp/.buildx-cache-manifest
          mv /tmp/.buildx-cache-manifest-new /tmp/.buildx-cache-manifest 2>/dev/null || true

  # ──────────────────────────────────────────────
  # JOB 2: Deploy locally (runner IS the server)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: self-hosted
    permissions:
      packages: read

    steps:
      - name: Pull and deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          cd "$DEPLOY_DIR"

          rollback_ref=""
          rollback() {
            [ -n "$rollback_ref" ] || return 1
            override="$(mktemp)"
            printf 'services:\n  web:\n    image: %s\n' "$rollback_ref" >"$override"
            docker compose \
              -f docker-compose.yml \
              -f "$override" \
              up -d --no-deps --no-build --pull never --force-recreate web
            rm -f "$override"

            for _ in $(seq 1 30); do
              status="$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || true)"
              [ "$status" = healthy ] && return 0
              sleep 2
            done
            return 1
          }

          fail_deploy() {
            printf 'ERROR: %s\n' "$1" >&2
            docker logs --tail 80 "$CONTAINER_NAME" 2>/dev/null || true
            if ! rollback; then
              printf 'ERROR: rollback failed or no previous image was available\n' >&2
            fi
            exit 1
          }

          echo "=== GHCR login (ephemeral token) ==="
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          current_image="$(docker inspect --format '{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)"
          if [ -n "$current_image" ]; then
            rollback_ref="aidd-rollback/manifest:$(date -u +%Y%m%dT%H%M%SZ)"
            docker image tag "$current_image" "$rollback_ref"
          fi

          echo "=== Pulling latest image ==="
          docker compose pull || fail_deploy "image pull failed"

          echo "=== Deploying ==="
          docker compose up -d --remove-orphans || fail_deploy "container recreation failed"

          echo "=== Waiting for healthy ==="
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "Container healthy after ${i}x5s"
              break
            fi
            if [ "$i" -eq 20 ]; then
              fail_deploy "container not healthy after 100s"
            fi
            sleep 5
          done

          echo "=== Smoke test ==="
          CONTAINER_IP=$(docker inspect --format='{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER_NAME")
          HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' "http://${CONTAINER_IP}:${CONTAINER_PORT}/" 2>/dev/null || true)
          if [ "${HTTP_CODE:-000}" != "200" ]; then
            fail_deploy "internal smoke test HTTP ${HTTP_CODE:-000}"
          fi

          echo "=== Public checklist smoke ==="
          check_public_endpoint() {
            local endpoint="$1"
            local attempt
            local http_code

            for attempt in $(seq 1 5); do
              http_code=$(curl -sS -o /dev/null -w '%{http_code}' \
                --connect-timeout 5 --max-time 15 \
                "${PUBLIC_ORIGIN}${endpoint}" || true)
              if [ "$http_code" = "200" ]; then
                echo "Public ${endpoint}: HTTP 200"
                return 0
              fi
              echo "WARN: Public ${endpoint} attempt ${attempt}/5 returned HTTP ${http_code:-000}"
              if [ "$attempt" -lt 5 ]; then
                sleep 3
              fi
            done

            fail_deploy "public checklist ${endpoint} failed"
          }

          check_public_endpoint "/healthz"
          check_public_endpoint "/"
          check_public_endpoint "/robots.txt"
          check_public_endpoint "/sitemap.xml"
          check_public_endpoint "/feed.xml"
          check_public_endpoint "/.well-known/security.txt"
          check_public_endpoint "/.well-known/agent-card.json"
          check_public_endpoint "/${INDEXNOW_KEY}.txt"

          echo "=== IndexNow submission ==="
          curl -fsS --get "https://api.indexnow.org/indexnow" \
            --data-urlencode "url=${PUBLIC_ORIGIN}/" \
            --data-urlencode "key=${INDEXNOW_KEY}" \
            -o /dev/null ||
            echo "WARNING: IndexNow submission failed; deployment remains healthy."

          echo "=== Deploy successful ==="
          echo "Image:  $(docker inspect --format='{{.Config.Image}}' "$CONTAINER_NAME")"
          echo "Health: $(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER_NAME")"
          echo "HTTP:   $HTTP_CODE"

          echo "=== GHCR logout ==="
          docker logout ghcr.io
          trap - EXIT
