name: Validate

on:
  pull_request:
  push:
    branches: [main, "renovate/**"]

# Cancel an in-progress run when a newer commit lands on the same ref (PR or
# branch), so rapid pushes don't pile up redundant runs. Scoped per-ref, so
# different PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check: build, typecheck, unit/browser tests, component LOC budget.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history so the signature-date generator (prebuild) can read
          # each signatory file's add commit.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
      - run: bash tests/check-component-loc.sh
      - run: npx playwright install --with-deps chromium
      # Visual snapshots require reviewed, tracked baselines before enabling.
      - run: npx playwright test tests/e2e/checklist.spec.ts tests/e2e/print.spec.ts tests/e2e/sign.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-test-results
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 7
