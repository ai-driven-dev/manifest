name: Validate

on:
  pull_request:
  push:
    branches: [main, "renovate/**"]

permissions:
  contents: read

# Cancel an in-progress run when a newer commit lands on the same ref (PR or
# branch), so rapid pushes don't pile up redundant runs. Scoped per-ref, so
# different PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check: build, typecheck, unit/signature tests, component LOC budget.
  build:
    runs-on:
      group: manifest-public-ci
      labels: [self-hosted, Linux, X64, aidd-central-manifest-public, isolated]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history so the signature-date generator (prebuild) can read
          # each signatory file's add commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
      - run: node --test ../.github/scripts/read-signature-request.test.js
      - run: bash tests/check-component-loc.sh
